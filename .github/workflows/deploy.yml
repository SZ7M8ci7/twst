name: Build and Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Once daily at 04:17 JST (19:17 UTC).
    - cron: '17 19 * * *'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Prepare local OCR runtime for recognition tests
      run: node scripts/recognition/prepare-runtime.mjs

    - name: Set up recognition dataset builder
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: scripts/recognition/requirements.txt

    - name: Install dataset dependencies
      run: pip install -r scripts/recognition/requirements.txt

    - name: Restore source image and feature cache
      uses: actions/cache@v4
      with:
        path: .cache/recognition-jp
        key: recognition-jp-v2-${{ runner.os }}-${{ github.run_id }}
        restore-keys: recognition-jp-v2-${{ runner.os }}-

    - name: Restore last published dictionary
      shell: bash
      run: |
        mkdir -p public/recognition
        if git fetch origin gh-pages --depth=1 && git cat-file -e FETCH_HEAD:recognition/latest.json 2>/dev/null; then
          if git show FETCH_HEAD:recognition/latest.json | python -c "import json,sys; m=json.load(sys.stdin); assert m.get('source')=='https://twst.wikiru.jp/' and m.get('schemaVersion')==2"; then
            git archive FETCH_HEAD recognition/objects recognition/latest.json recognition/catalog.json | tar -x -C public
          fi
        fi

    - name: Test updater and refresh recognition dictionary
      shell: bash
      env:
        UPDATE_EVENT: ${{ github.event_name }}
      run: |
        python scripts/recognition/test_update.py
        python scripts/recognition/test_supplement.py
        python scripts/recognition/test_http.py
        python scripts/recognition/test_incremental.py
        if [ "$UPDATE_EVENT" != "schedule" ] && python -c "import sys; sys.path.insert(0, 'scripts/recognition'); import update; from pathlib import Path; update.reuse_release(Path('public/recognition'))"; then
          echo 'Reusing the published dictionary without contacting source Wikis.'
        elif ! python scripts/recognition/update.py; then
          python -c "import sys; sys.path.insert(0, 'scripts/recognition'); import update; from pathlib import Path; m, _ = update.previous_release(Path('public/recognition')); assert m, 'No verified Japanese Wiki release'; update.atomic(Path('src/assets/chara.json'), (Path('public/recognition') / m.get('catalog',{}).get('path','catalog.json')).read_bytes())"
          echo '::warning::Wiki refresh failed. Publishing the last verified dictionary with its original timestamp.'
        fi

    - name: Validate dictionary and recognition engine
      run: npm run test:recognition
      env:
        RECOGNITION_REQUIRED: '1'

    - name: Retain update report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recognition-update-report
        path: |
          .cache/recognition-jp/last-report.json
          public/recognition/latest.json
          artifacts/recognition-accuracy/regression-results.json
          artifacts/recognition-collection-grid/regression-results.json
        if-no-files-found: ignore
        retention-days: 14
      
    - name: Build
      run: npm run build
      
    - name: Deploy
      run: |
        git remote set-url origin https://github-actions:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        npm run deploy-github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
