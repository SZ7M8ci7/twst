name: Synthetic screening independent source processes
on:
  push:
    branches: [codex/benchmark-p1-ranked-20261114]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {"variant": "P1", "replicate": 0, "shard": 0, "shardCount": 1}
          - {"variant": "P1", "replicate": 1, "shard": 0, "shardCount": 1}
          - {"variant": "P1", "replicate": 2, "shard": 0, "shardCount": 1}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Prepare independent baseline and variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          git worktree add --detach baseline 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git worktree add --detach candidate 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git -C baseline apply ../bench-public/patches/T1.patch
          git -C candidate apply "../bench-public/patches/$VARIANT.patch"
          echo "Variant applied: $VARIANT"
          ln -s ../node_modules baseline/node_modules
          ln -s ../node_modules candidate/node_modules
          (cd candidate && node --test tests/exam-search.test.cjs && if [ -f tests/importance-expected.test.cjs ]; then node --test tests/importance-expected.test.cjs; fi && ../node_modules/.bin/tsc --noEmit)
          node bench-public/generate.mjs
          mkdir -p artifacts
          node -e 'console.log(JSON.stringify({runner:process.env.RUNNER_NAME,hostname:require("os").hostname(),cpus:require("os").cpus().length,start:new Date().toISOString()}))' > artifacts/runner.json
      - name: Paired 8-case screening and frozen rare audit
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          node bench-public/run-production.mjs "$VARIANT" "${{ matrix.replicate }}" "${{ matrix.shard }}" "${{ matrix.shardCount }}"
          if [ "${{ matrix.shard }}" = "$((4 % ${{ matrix.shardCount }}))" ]; then
            node bench-public/audit-production.mjs baseline "${{ matrix.replicate }}" "$VARIANT"
            node bench-public/audit-production.mjs candidate "${{ matrix.replicate }}" "$VARIANT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.variant }}-rep${{ matrix.replicate }}-shard${{ matrix.shard }}
          path: |
            artifacts/runner.json
            artifacts/fixed-*.json
            artifacts/nrc19/**/case-*.json
            artifacts/nrc19/**/checkpoint-*.json
            artifacts/nrc19/**/plan-*.json
          retention-days: 14
