name: Synthetic paired screening 20 independent runners
on:
  push:
    branches: [codex/benchmark-matrix-20-20261114]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [E1,E2,E3,E4,E5,E6,E7,S3,S4,S5,S6,S7,S8,S9,P1,P2,P3,P4,P5,P6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Prepare independent baseline and variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          git worktree add --detach baseline 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git worktree add --detach candidate 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git -C candidate apply "../bench-public/patches/$VARIANT.patch"
          if [ "$VARIANT" = P2 ]; then git -C candidate apply ../bench-public/patches/P2-boundary.patch; fi
          ln -s ../node_modules baseline/node_modules
          ln -s ../node_modules candidate/node_modules
          node bench-public/generate.mjs
          mkdir -p artifacts
          node -e 'console.log(JSON.stringify({runner:process.env.RUNNER_NAME,hostname:require("os").hostname(),cpus:require("os").cpus().length,start:new Date().toISOString()}))' > artifacts/runner.json
      - name: Paired 15-case small screening
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/benchmarks/paired.mjs --before=baseline --after=candidate --inputs=bench-public/profiles.generated.json --plan=bench-public/plan.json --time-ms=30000 --audit=256 --supports=current --nonce=actions-synthetic-20261114-v1 --tag="$VARIANT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.variant }}
          path: |
            artifacts/runner.json
            artifacts/nrc19/**/case-*.json
            artifacts/nrc19/**/plan-*.json
          retention-days: 14
