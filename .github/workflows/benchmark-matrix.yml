name: Next-wave T1 fixed-base independent synthetic screening
on:
  push:
    branches: [codex/benchmark-V2-screen-20261114]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          - {"variant": "V2", "mode": "long", "replicate": 0, "caseIndex": 0}
          - {"variant": "V2", "mode": "long", "replicate": 0, "caseIndex": 1}
          - {"variant": "V2", "mode": "long", "replicate": 0, "caseIndex": 2}
          - {"variant": "V2", "mode": "long", "replicate": 0, "caseIndex": 3}
          - {"variant": "V2", "mode": "long", "replicate": 1, "caseIndex": 0}
          - {"variant": "V2", "mode": "long", "replicate": 1, "caseIndex": 1}
          - {"variant": "V2", "mode": "long", "replicate": 1, "caseIndex": 2}
          - {"variant": "V2", "mode": "long", "replicate": 1, "caseIndex": 3}
          - {"variant": "V2", "mode": "long", "replicate": 2, "caseIndex": 0}
          - {"variant": "V2", "mode": "long", "replicate": 2, "caseIndex": 1}
          - {"variant": "V2", "mode": "long", "replicate": 2, "caseIndex": 2}
          - {"variant": "V2", "mode": "long", "replicate": 2, "caseIndex": 3}
          - {"variant": "V2", "mode": "short", "replicate": 0, "caseIndex": 0}
          - {"variant": "V2", "mode": "short", "replicate": 0, "caseIndex": 1}
          - {"variant": "V2", "mode": "short", "replicate": 0, "caseIndex": 2}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Prepare independent baseline and variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          git worktree add --detach baseline 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git worktree add --detach candidate 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git -C baseline apply "../bench-public/patches/T1.patch"
          git -C candidate apply "../bench-public/patches/T1.patch"
          git -C candidate apply "../bench-public/patches/$VARIANT.patch"
          echo "Variant applied: $VARIANT"
          ln -s ../node_modules baseline/node_modules
          ln -s ../node_modules candidate/node_modules
          (cd candidate && node --test tests/exam-search.test.cjs tests/exam-search-tail-runtime.test.cjs && if [ -f tests/importance-expected.test.cjs ]; then node --test tests/importance-expected.test.cjs; fi && ../node_modules/.bin/tsc --noEmit)
          node bench-public/generate.mjs
          mkdir -p artifacts
          node -e 'console.log(JSON.stringify({runner:process.env.RUNNER_NAME,hostname:require("os").hostname(),cpus:require("os").cpus().length,start:new Date().toISOString()}))' > artifacts/runner.json
      - name: Paired 8-case screening and frozen rare audit
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          node bench-public/run-production.mjs "$VARIANT" "${{ matrix.mode }}" "${{ matrix.replicate }}" "${{ matrix.caseIndex }}"
          if [ "${{ matrix.caseIndex }}" = "2" ]; then
            node bench-public/audit-production.mjs baseline "${{ matrix.replicate }}" "$VARIANT-${{ matrix.mode }}"
            node bench-public/audit-production.mjs candidate "${{ matrix.replicate }}" "$VARIANT-${{ matrix.mode }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.variant }}-${{ matrix.mode }}-rep${{ matrix.replicate }}-case${{ matrix.caseIndex }}
          path: |
            artifacts/runner.json
            artifacts/fixed-*.json
            artifacts/nrc19/**/case-*.json
            artifacts/nrc19/**/checkpoint-*.json
            artifacts/nrc19/**/plan-*.json
          retention-days: 14
