name: Synthetic screening independent source processes
on:
  push:
    branches: [codex/benchmark-matrix-wave4-20261114]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [G1,G2,R1,R2,T1,T2]
        replicate: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Prepare independent baseline and variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          git worktree add --detach baseline 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git worktree add --detach candidate 2ea835980091457bdaaaca7e90638c2e2f19ca19
          git -C candidate apply "../bench-public/patches/$VARIANT.patch"
          echo "Variant applied: $VARIANT"
          ln -s ../node_modules baseline/node_modules
          ln -s ../node_modules candidate/node_modules
          node bench-public/generate.mjs
          mkdir -p artifacts
          node -e 'console.log(JSON.stringify({runner:process.env.RUNNER_NAME,hostname:require("os").hostname(),cpus:require("os").cpus().length,start:new Date().toISOString()}))' > artifacts/runner.json
      - name: Paired 15-case small screening
        env:
          VARIANT: ${{ matrix.variant }}
        run: node bench-public/run-isolated.mjs "$VARIANT" "${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.variant }}-rep${{ matrix.replicate }}
          path: |
            artifacts/runner.json
            artifacts/nrc19/**/case-*.json
            artifacts/nrc19/**/plan-*.json
          retention-days: 14
