name: Update twst repository with content from simulator

on:
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '30 4,9,16,21 * * *'
  workflow_dispatch:

jobs:
  update_twst_repo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout simulator repository
      uses: actions/checkout@v2
      with:
        repository: 'SZ7M8ci7/simulator'
        path: 'simulator-repo'

    - name: Checkout twst repository
      uses: actions/checkout@v2
      with:
        path: 'twst-repo'

    - name: Copy img folder and chara.json to twst repository
      run: |
        cp -R ./simulator-repo/img/* ./twst-repo/src/assets/img/
        cp ./simulator-repo/chara.json ./twst-repo/src/assets/chara.json
        cp ./simulator-repo/characters_info.json ./twst-repo/src/assets/characters_info.json


    - name: Set up icon verification
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install icon verification dependency
      run: pip install Pillow==11.3.0

    - name: Icon verifier regression tests
      working-directory: twst-repo
      run: python -m unittest discover -s scripts/tests -p 'test_card_icons.py' -v

    # Keep icon failures non-blocking until commit and deploy dispatch finish.
    - name: Verify synchronized card icons
      id: icons
      continue-on-error: true
      working-directory: twst-repo
      run: python scripts/check_card_icons.py

    - name: Commit and push changes to twst repository
      run: |
        cd ./twst-repo
        git remote set-url origin https://github-actions:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add src/assets/img src/assets/chara.json src/assets/characters_info.json
        # Check for any changes
        if git diff --staged --exit-code; then
          echo "No changes to commit."
        else
          git commit -m "Automated update: img folder and chara.json from simulator repository"
          git push origin HEAD:master; \
        fi

    - name: Trigger deploy workflow
      if: success()
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy.yml',
            ref: 'master'
          });


    - name: Retain card icon report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: synchronized-card-icons
        path: twst-repo/reports/card-icons.json
        retention-days: 30

    - name: Fail visibly for unresolved icons
      if: ${{ !cancelled() && steps.icons.outcome == 'failure' }}
      run: |
        echo '::error::Synchronized card icons are incomplete. See job summary and artifact.'
        exit 1
